server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    # resolve the backend at request time so nginx starts even if the backend is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8765;

    location /api/ {
        proxy_pass $backend;   # no URI part: with a variable nginx forwards the original /api/... path
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # keep NDJSON streaming live
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
