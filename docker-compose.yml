services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data
      - hf-cache:/cache/huggingface
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  hf-cache:
